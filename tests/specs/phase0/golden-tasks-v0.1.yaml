tasks:
  - id: GW-P0-001
    category: Profile
    task_origin: sanitized_inventory
    real_task_origin: null
    scenario:
      given: "Given a sanitized inventory snapshot showing `.private/` does not exist and `.gitignore` does not ignore it."
      when: "When doctor evaluates local_private readiness for adopt."
      then: "Then it must fail closed on the missing private boundary."
    input_fixture:
      fixture_ids: [fx_inventory_2026_07_25]
      source_policy: sanitized_snapshot_only
    expected:
      kind: diagnostic
      level: unsafe
      code: GW_DOC_UNSAFE_PRIVATE_BOUNDARY
    assertions:
      - dimension: fact_value
        must: "Report both `missing_private_dir=true` and `private_ignore_missing=true`."
      - dimension: provenance
        must: "Cite only `kb-inventory-2026-07-25.md` metadata as evidence."
      - dimension: freshness
        must: "Tie the finding to the 2026-07-25 inventory snapshot and not claim a timeless guarantee."
      - dimension: permission
        must: "State that local_private protection cannot be assumed and remote use stays denied until fixed."
      - dimension: diagnostic_level
        must: "Classify the issue as `unsafe`, not `repairable` or `advisory`."
      - dimension: boundary
        must: "Do not read or quote any KnowledgeBase body text to reach the result."

  - id: GW-P0-002
    category: Profile
    task_origin: sanitized_inventory
    real_task_origin: null
    scenario:
      given: "Given a sanitized inventory snapshot showing 5 tracked L3 profile files, broken down into 4 indexes and 1 voice-samples file."
      when: "When doctor evaluates tracked sensitive profile material."
      then: "Then it must require manual review without exposing body text."
    input_fixture:
      fixture_ids: [fx_inventory_2026_07_25]
      source_policy: sanitized_snapshot_only
    expected:
      kind: diagnostic
      level: unsafe
      code: GW_DOC_UNSAFE_TRACKED_L3_REVIEW
    assertions:
      - dimension: fact_value
        must: "Report the tracked L3 count as 5 and preserve the `4 indexes + 1 voice-samples` breakdown."
      - dimension: provenance
        must: "Attribute the result to frontmatter-only inventory scanning, not full file reading."
      - dimension: freshness
        must: "Bind the finding to the same inventory snapshot commit and worktree hash."
      - dimension: permission
        must: "Forbid promotion, sharing, or remote-model use until manual review completes."
      - dimension: diagnostic_level
        must: "Keep the finding `unsafe` because the tracked combination can violate storage guarantees."
      - dimension: boundary
        must: "Never quote, summarize, or infer any voice-samples body content."

  - id: GW-P0-003
    category: Profile
    task_origin: sanitized_inventory
    real_task_origin: null
    scenario:
      given: "Given a legacy profile policy that allows cloud use and the current governance rule that remote_model defaults to deny."
      when: "When doctor compares current policy against GoldenWave Phase 1 defaults."
      then: "Then it must flag explicit policy drift and propose repair without editing the contract."
    input_fixture:
      fixture_ids: [fx_inventory_2026_07_25, fx_knowledge_conflict]
      source_policy: sanitized_plus_synthetic
    expected:
      kind: diagnostic
      level: repairable
      code: GW_DOC_REPAIRABLE_REMOTE_POLICY_DRIFT
    assertions:
      - dimension: fact_value
        must: "Detect that legacy remote-model behavior is `allow` while GoldenWave default is `deny`."
      - dimension: provenance
        must: "Cite both the sanitized inventory note and `spec/governance.md` as the compared sources."
      - dimension: freshness
        must: "Prefer the 2026-07-24 governance rule over the older 2026-06-10 legacy rule while still surfacing the conflict."
      - dimension: permission
        must: "Keep `store`, `share`, and `remote_model` scopes separate instead of collapsing them into one boolean."
      - dimension: diagnostic_level
        must: "Classify this as `repairable`, not `unsafe`, because the drift can be fixed with explicit user action."
      - dimension: boundary
        must: "Do not silently rewrite or normalize the existing agent-contract file."

  - id: GW-P0-004
    category: Profile+Knowledge
    task_origin: synthetic
    real_task_origin: null
    scenario:
      given: "Given a synthetic profile with timezone, update style, and a redacted L3 health note."
      when: "When context build serves a low-risk task that only needs schedule and communication style."
      then: "Then it must produce a minimal profile context pack."
    input_fixture:
