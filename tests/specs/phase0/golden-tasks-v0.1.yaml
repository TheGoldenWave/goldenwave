suite:
  id: phase0-contract-security-preregistration
  version: v0.1
  status: preregistered
  feature_id: goldenwave-strategy
  scope: P0-05
  classification: contract-security-preregistration
  measurement_scope: "Not eligible for the PRD real-task 20-task/40-run denominator."
  follow_on_real_suite: tests/specs/phase0/real-dogfood-tasks-v0.1.yaml
  rubric_ref: tests/specs/phase0/README.md
  fixture_policy:
    allowed_real_input:
      - docs/context/technical/goldenwave/kb-inventory-2026-07-25.md
      - docs/prd/goldenwave-strategy/PRD.md
      - docs/prd/goldenwave-strategy/.artifacts/process.md
      - ROADMAP.md
      - SPEC.md
      - spec/governance.md
      - spec/L3-workflow.md
    forbidden_real_input:
      - /Users/goldenwave/KnowledgeBase body text
      - profile/persona/voice-samples.md body text
      - .private/** body text
      - any raw source body outside the sanitized inventory snapshot
    rule: "Every task input must be a sanitized snapshot or a synthetic payload; no task may require reading real private body text."
    runner_input_rule: "The runner consumes only each fixture's embedded `payload`; a sanitized fixture's `source` is provenance metadata and must not be opened during replay."
  snapshot_ref:
    inventory_doc: docs/context/technical/goldenwave/kb-inventory-2026-07-25.md
    inventory_observed_at: "2026-07-25"
    source_commit: ba8b8cf977237830b8dc21cd12e0579c09849029
    dirty_status_sha256: e02a3a52fedd5c6550559c79c65bf1dc9f4b73701adb3ced3ef27756ce20f7fd
    tracked_diff_sha256: f30cc5998f3725968f2d286081d3c08008f970f786fb12872efe46e996c2d799
    worktree_content_sha256: acc30da933e29960735534704fe1caee13c060d191a4dfa280afeb500fcde6a8
  counts:
    tasks: 20
    assertions: 120
    category_coverage:
      Profile: 9
      Knowledge: 9
      Project: 9
  capacity_policy:
    algorithm: utf8_bytes
    profile_pack_max_bytes: 8192
    knowledge_pack_max_bytes: 32768
    boundary_rule: "Allow when actual_bytes <= max_bytes; deny when actual_bytes >= max_bytes + 1."

error_codes:
  - code: GW_DOC_UNSAFE_PRIVATE_BOUNDARY
    meaning: "Missing or unignored local_private boundary; doctor must fail closed."
  - code: GW_DOC_UNSAFE_TRACKED_L3_REVIEW
    meaning: "Tracked L3 profile material needs manual review without body reads."
  - code: GW_DOC_REPAIRABLE_REMOTE_POLICY_DRIFT
    meaning: "Legacy permission policy conflicts with GoldenWave defaults but can be repaired explicitly."
  - code: GW_CTX_OK_PROFILE_MINIMAL
    meaning: "Minimal profile context pack is correct, sourced, fresh enough, and permission clipped."
  - code: GW_CTX_STALE_PROFILE_FACT
    meaning: "A profile fact is present but stale and must be marked for confirmation."
  - code: GW_CAND_INVALID_UNCONFIRMED_INFERENCE
    meaning: "Inference cannot be promoted to formal profile/project fact without confirmation."
  - code: GW_CTX_BUDGET_EXCEEDED_PROFILE
    meaning: "Profile context request exceeds candidate capacity budget and must be reduced."
  - code: GW_CTX_OK_KNOWLEDGE_ENTITY
    meaning: "Knowledge answer is correct, sourced, fresh, and permission-safe."
  - code: GW_CTX_CONFLICT_REQUIRES_FRESHNESS
    meaning: "Conflicting knowledge requires an explicit freshness-based resolution."
  - code: GW_DOC_ADVISORY_WIKI_QUALITY
    meaning: "Knowledge quality issues are advisory and must not be confused with safety failures."
  - code: GW_DOC_INVALID_FRONTMATTER
    meaning: "Malformed structure is invalid and must be rejected before body use."
  - code: GW_CTX_UNSAFE_RAW_SOURCE_LEAK
    meaning: "A raw source or ephemeral artifact is being leaked as formal knowledge."
  - code: GW_CTX_BUDGET_EXCEEDED_WIKI
    meaning: "A knowledge pack exceeds the frozen candidate capacity budget."
  - code: GW_CTX_OK_PROJECT_STATUS
    meaning: "Project status answer matches process and roadmap snapshots."
  - code: GW_DOC_ADVISORY_DIRTY_WORKTREE
    meaning: "Dirty worktree is reported as a reproducibility risk, not auto-cleaned."
  - code: GW_CAND_REPAIRABLE_CAS_MISMATCH
    meaning: "CAS or idempotency collision requires retry/rebase without overwrite."
  - code: GW_DOC_REPAIRABLE_STAGE_DRIFT
    meaning: "Project documents disagree on stage and require an explicit repair."
  - code: GW_CAND_INVALID_CONTRACT_VERSION
    meaning: "Unsupported major contract version must be rejected."
  - code: GW_CTX_DENIED_REMOTE_SCOPE
    meaning: "The entire request is denied because `remote_model=false`; no payload fields may be sent."
  - code: GW_CTX_OK_PORTABLE_CROSS_AGENT
    meaning: "The same context contract is portable across Claude Code and Codex."

