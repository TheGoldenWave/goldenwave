      source_policy: synthetic_only
    expected:
      kind: outcome
      code: GW_CTX_OK_PROFILE_MINIMAL
      outcome: minimal_profile_context_pack
    assertions:
      - dimension: fact_value
        must: "Include `timezone=Asia/Shanghai` and `preferred_update_style=concise-direct`."
      - dimension: provenance
        must: "Carry the source pointer for each included fact."
      - dimension: freshness
        must: "Carry each fact's `verified_at` and `refresh_days` fields into the pack."
      - dimension: permission
        must: "Serve the pack only to `consumer=local_trusted_agent`; exclude the L3 health note because that fact is denied even to the local trusted agent in this fixture."
      - dimension: minimality
        must: "Return only the minimum facts needed for the task rather than a full profile dump."
      - dimension: error_code
        must: "Return the success code `GW_CTX_OK_PROFILE_MINIMAL`."

  - id: GW-P0-005
    category: Profile
    task_origin: synthetic
    real_task_origin: null
    scenario:
      given: "Given a synthetic profile fact whose refresh window has already expired."
      when: "When an agent asks for that fact in a context pack."
      then: "Then the fact may be surfaced only as stale and confirmation-needed."
    input_fixture:
      fixture_ids: [fx_profile_stale_contact]
      source_policy: synthetic_only
    expected:
      kind: outcome
      code: GW_CTX_STALE_PROFILE_FACT
      outcome: stale_fact_warning
    assertions:
      - dimension: fact_value
        must: "Keep `preferred_contact_window=weekday-evening` intact instead of fabricating a replacement value."
      - dimension: provenance
        must: "Preserve `profile/05-time-energy/contact-window.md` as the source."
      - dimension: freshness
        must: "At frozen `evaluation_at/as_of=2026-07-25T10:00:00+08:00`, mark the fact stale because `verified_at=2026-05-01` plus `refresh_days=7` expired on `2026-05-08`."
      - dimension: permission
        must: "Do not elevate the stale fact into an authorized remote-model payload."
      - dimension: status
        must: "Request user confirmation instead of silently treating the value as current truth."
      - dimension: error_code
        must: "Return `GW_CTX_STALE_PROFILE_FACT`."

  - id: GW-P0-006
    category: Profile+Project
    task_origin: synthetic
    real_task_origin: null
    scenario:
      given: "Given a synthetic candidate inferred from an agent run but not confirmed by the user."
      when: "When the system attempts to promote the inference into formal profile or project memory."
      then: "Then promotion must be blocked and remain a candidate."
    input_fixture:
      fixture_ids: [fx_profile_inference_candidate]
      source_policy: synthetic_only
    expected:
      kind: diagnostic
      level: invalid
      code: GW_CAND_INVALID_UNCONFIRMED_INFERENCE
    assertions:
      - dimension: fact_value
        must: "Keep the inferred claim `role_primary=architect` as candidate data only."
      - dimension: provenance
        must: "Preserve `agent-run://demo/session-17` and `evidence_type=inference`."
      - dimension: freshness
        must: "Treat the inference as unverified current-session evidence, not as durable truth."
      - dimension: permission
        must: "Require explicit user confirmation before any write into Profile or Project layers."
      - dimension: diagnostic_level
        must: "Reject the promotion as `invalid` for formal injection in its current state."
      - dimension: boundary
        must: "Do not auto-rewrite the candidate to look confirmed."

  - id: GW-P0-007
    category: Profile
    task_origin: synthetic
    real_task_origin: null
    scenario:
      given: "Given a profile pack measured by deterministic UTF-8 bytes with `max_bytes=8192`, a pass boundary at `8192`, and a failing candidate at `8193`."
      when: "When context build evaluates it against a candidate capacity budget."
      then: "Then it must reject the oversized pack and require trimming."
    input_fixture:
      fixture_ids: [fx_profile_minimal_public, fx_profile_budget_boundary]
      source_policy: synthetic_only
    expected:
      kind: diagnostic
      level: repairable
      code: GW_CTX_BUDGET_EXCEEDED_PROFILE
    assertions:
      - dimension: fact_value
        must: "Return a budget overflow decision because `actual_candidate_bytes=8193` exceeds `max_bytes=8192`."
      - dimension: provenance
        must: "Ground the decision in the frozen `utf8_bytes` capacity policy and `fx_profile_budget_boundary` measurement fixture."
      - dimension: freshness
        must: "Carry or cite `measured_at=2026-07-25T10:00:00+08:00` for the byte measurement."
      - dimension: permission
        must: "Keep the request scoped to `consumer=local_trusted_agent`; budget failure must not widen scope or trigger remote fallback."
      - dimension: capacity
        must: "Apply the exact boundary rule: `8192` bytes is allowed, `8193` bytes is denied."
      - dimension: error_code
        must: "Return `GW_CTX_BUDGET_EXCEEDED_PROFILE`."

  - id: GW-P0-008
    category: Knowledge
    task_origin: synthetic
    real_task_origin: null
    scenario:
      given: "Given a synthetic knowledge fixture built from the approved strategy and roadmap gates."
      when: "When an agent answers what must happen before a stable public contract is announced."
      then: "Then the answer must cite the right release gates."
    input_fixture:
      fixture_ids: [fx_knowledge_phase_gates]
      source_policy: synthetic_only
    expected:
      kind: outcome
      code: GW_CTX_OK_KNOWLEDGE_ENTITY
      outcome: sourced_knowledge_answer
    assertions:
      - dimension: fact_value
        must: "State that stable public contract waits for personal closed-loop validation plus two external design-partner reruns."
      - dimension: provenance
