confirmation_protocol:
  collection: suite_level_once
  covers:
  - representativeness_of_all_20_tasks
  - owner_value.update_style_label
  - owner_value.timezone
  canonical_payload:
    schema_version: owner-confirmation/v1
    canonicalization: UTF-8 canonical JSON with recursively lexicographically sorted object keys
    required_fields:
    - schema_version
    - fixture_ref
    - local_fixture_content_sha256
    - confirmed_at
    - retention
    - scope
    - storage_class
    retention_modes:
    - until_baseline_complete
    - expires_at
    local_fixture_content_hash_rule: SHA-256 over exactly 32 random bytes encoded as lowercase hex64 ASCII, then one NUL byte, then owner-values/v1 canonical JSON UTF-8 bytes.
    confirmation_digest_rule: SHA-256 of the canonical payload containing metadata plus local_fixture_content_sha256; raw owner values and nonce are excluded.
    retention_rule: Both modes require expires_at later than confirmed_at; until_baseline_complete deletes at baseline completion or the hard expiry, whichever comes first.
    fixture_ref_format: ownerconf_[0-9a-f]{16,64}
    storage_reference_rule: Resolved fixture_ref is opaque and must not contain a path, URI, storage backend, or placeholder; pending preregistration uses the explicit placeholder <OWNER_CONFIRMATION_REF:owner_suite_confirmation_v1>.
  allowed_storage_classes:
  - local_private
  - ephemeral
  per_run_rule: Pending suites do not execute confirmation-bound tasks. After confirmation, runs consume the frozen reference and confirmation digest only; they never ask the owner to repeat values.
  repo_record:
    allowed:
    - schema_version
    - fixture_ref
    - confirmation_digest
    - local_fixture_content_sha256
    - confirmed_at
    - retention
    - scope
    - storage_class
    raw_owner_values: forbidden
    local_fixture_nonce: forbidden
  post_confirmation_change_rule: Any immutable suite manifest change after confirmation requires a new suite version and a new owner confirmation over the new manifest digest.
  fixture_schema_id: owner-values/v1
  owner_values_fixture:
    schema_version: owner-values/v1
    canonicalization: UTF-8 canonical JSON with recursively lexicographically sorted object keys and no insignificant whitespace
    exact_fields:
    - schema_version
    - update_style_label
    - timezone
    field_rules:
      schema_version:
        type: string
        const: owner-values/v1
      update_style_label:
        type: string
        enum:
        - current_next_prose
        - current_next_bullets
        reviewer_observable_contracts:
          current_next_prose:
          - One compact paragraph only.
          - Paragraph contains exactly one `Current:` clause followed by exactly one `Next:` clause.
          - No bullets are used.
          current_next_bullets:
          - Exactly two flat bullets only.
          - The first bullet begins `Current:` and the second bullet begins `Next:`.
          - No extra prose paragraph or extra bullet is allowed.
      timezone:
        type: string
        whitespace_only: forbidden
        format: iana_tz_identifier
        confirmation_time_validation: Resolve inside system zoneinfo roots /usr/share/zoneinfo or /var/db/timezone/zoneinfo/zoneinfo to a regular file whose first 4 bytes are TZif; reject helper text files such as zone.tab, iso3166.tab, tzdata.zi, and leapseconds; explicitly reject compatibility or local special IDs posixrules, localtime, Factory, and any SystemV/* identifier even if present; preregistration validates descriptor only.
    nonce:
      random_bytes: 32
      encoding: lowercase_hex
      encoded_length: 64
    content_digest:
      algorithm: sha256
      input_bytes: ASCII nonce_hex + NUL byte + canonical_json_utf8
    repository_rule: Store only local_fixture_content_sha256; raw values, nonce_hex, and storage location are forbidden.
tasks:
- id: rdt_profile_handoff_update_style
  categories:
  - Profile
  - Project
  real_task_origin:
    workflow_type: cross-agent-handoff
    project_docs:
    - AGENTS.md
    - docs/context/product-initiated/goldenwave-strategy-202607/research_synthesis.md
    - docs/prd/goldenwave-strategy/.artifacts/process.md
    evidence_kind: observed_workflow
  user_intent: 在 Claude Code 和 Codex 之间交接 GoldenWave 工作时，沿用我的状态更新风格，而不是每次重新适配。
  required_context_classes:
  - profile.low_sensitivity.communication_style
  - project.agent_collaboration_rules
  forbidden_context_classes:
  - profile.health
  - profile.finance
  - profile.social_relationships
  - private_body_text
  sanitized_snapshot_plan:
    extraction_rule: 只取协作规范、‘用户已在多个 Agent 间真实协作’这一低敏结论，以及冻结 process 中的当前状态和下一步。
  expected_outcome:
    once_confirmed:
      expected_behavior: The answer or handoff follows the reviewer-observable contract frozen for the confirmed update_style_label enum and cites both the owner confirmation and AGENTS-level collaboration rules.
    confirmation_ref_required: true
    if_confirmation_ref_missing: The run is invalid; do not ask the owner again and do not guess the low-sensitivity value.
  assertion_dimensions:
  - dimension: fact_value
    must: 'Output makes every expected fact observable: After token resolution, the handoff follows the reviewer-observable contract frozen for <OWNER_VALUE:update_style_label> in owner-values/v1: either one compact paragraph with exactly one `Current:` clause followed by one `Next:` clause, or exactly two flat bullets labelled `Current:` then `Next:`. | The handoff follows the collaboration and progress-reporting rules from src_agents. | The handoff reports P0-05b oracle review as current state and owner confirmation followed by P0-06 manual baseline as the next action from src_strategy_process.'
    must_not: 'Output must not state or imply any forbidden fact: Do not invent a free-form style outside the owner-values/v1 enum or print the unresolved owner token. | Do not include unrelated Profile fields.'
  - dimension: provenance
    must: 'Output identifies the factual basis from all required source IDs: src_agents, src_research_synthesis, src_strategy_process, and the bound suite confirmation reference.'
    must_not: Output must not cite an undeclared source, hidden memory, host default, or unverifiable owner value.
  - dimension: freshness
    must: Use the 2026-07-25 frozen digests for dynamic source src_strategy_process; a mismatch invalidates the suite version.
    must_not: Output must not silently use a newer, older, or digest-mismatched source snapshot.
  - dimension: permission
    must: Use only src_agents, src_research_synthesis, src_strategy_process plus the suite-level owner confirmation reference declared in input_manifest; the owner value tokens must resolve through its bound confirmation digest.
    must_not: Do not access profile.health, profile.finance, profile.social_relationships, private_body_text or ask the owner for per-run values.
  - dimension: minimality
    must: The handoff contains only the resolved update-style field needed for this Profile purpose.
    must_not: The handoff must not add timezone or any unrelated personal field.
  - dimension: workflow_fit
    must: The visible cross-agent handoff states current P0-05b review and the next owner-confirmation then P0-06 action.
    must_not: The output must not omit state/next action or use project status not present in src_strategy_process.
  baseline_run_protocol:
    mode: phase0-human-proxy
    run_order: Pending suites stop before execution because input_manifest carries explicit confirmation placeholders only. Once confirmed, reviewer supplies the frozen sources plus the bound suite confirmation reference and digest, presents frozen_prompt verbatim, and never asks the owner to repeat values.
    evidence_capture:
      raw_output:
        allowed_storage_classes:
        - local_private
        - ephemeral
        repo_storage: forbidden
      redacted_derivative:
        artifact_kind: redacted_evidence
        independent_artifact: true
        repo_storage: allowed
        field_allowlist:
        - suite_id
        - task_id
        - run_id
        - agent
        - timestamps
        - assertion_results
        - error_class
        - correction_cost
        - evidence_refs
      repo_artifact: scorecard_metadata_only
      scorecard_fields:
      - suite_id
      - task_id
      - run_id
      - agent
      - timestamps
      - assertion_results
      - error_class
      - correction_cost
      - evidence_refs
  frozen_prompt: 在 Claude Code 和 Codex 之间交接 GoldenWave 工作时，沿用我的状态更新风格，而不是每次重新适配。
